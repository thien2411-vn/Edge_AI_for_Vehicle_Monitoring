<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Đỗ xe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-200 h-screen w-full flex flex-col overflow-hidden">

    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-6">

            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-400">
                <a href="index.html" class="text-white transition border-b-2 border-blue-500 py-4">Hệ thống</a>
                <a href="data.html" class="hover:text-white transition border-b-2 border-transparent py-4">Dữ liệu</a>
            </nav>
        </div>

    </header>

    <main class="flex-grow p-4 lg:p-6 overflow-hidden">
        <div class="grid grid-cols-12 gap-6 h-full">
            
            <section class="col-span-12 lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
                
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col shadow-2xl">
                    <div class="flex justify-between items-center mb-3 shrink-0">
                        <h2 class="text-sm font-bold text-blue-400 uppercase tracking-widest flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                            Camera Lối Vào
                        </h2>

                    </div>
                    <div class="relative flex-grow rounded-lg overflow-hidden bg-black border border-slate-700/50">
                        <img id="mainCamIn" src="/video_feed_in" class="absolute inset-0 w-full h-full object-cover" alt="Luồng Lối Vào">
                    </div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col shadow-2xl">
                    <div class="flex justify-between items-center mb-3 shrink-0">
                        <h2 class="text-sm font-bold text-orange-400 uppercase tracking-widest flex items-center gap-2">
                            Camera Lối Ra
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        </h2>

                    </div>
                    <div class="relative flex-grow rounded-lg overflow-hidden bg-black border border-slate-700/50">
                        <img id="liveCamOut" src="/video_feed_out" class="absolute inset-0 w-full h-full object-cover" alt="Luồng Lối Ra">
                    </div>
                </div>

            </section>

            <section class="col-span-12 lg:col-span-4 bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col gap-6 h-full shadow-2xl overflow-y-auto">
                
                <div class="bg-slate-800/40 rounded-xl p-5 border border-slate-700/50 text-center flex flex-col items-center justify-center">
                    <div id="statusBadge" class="w-full bg-slate-700/50 text-slate-300 border border-slate-600 font-bold px-4 py-3 rounded-lg text-lg tracking-wide transition-all duration-300">
                        SẴN SÀNG QUẸT THẺ
                    </div>

                    <div id="priceDisplay" class="text-5xl font-black text-yellow-400 tracking-tight mt-4 drop-shadow-md">0 đ</div>
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <div class="flex flex-col">
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-widest text-center bg-slate-800 py-2.5 rounded-t-lg border border-b-0 border-slate-700">Biển Vào</div>
                        <div class="h-28 bg-black border-x border-slate-700 flex items-center justify-center p-1.5 relative">
                            <img id="imgCamIn" src="https://placehold.co/200x80/2d3748/475569?text=Waiting" class="absolute inset-0 w-full h-full object-contain" alt="Biển Vào">
                        </div>
                        <input type="text" id="plateIn" value="" placeholder="---" class="w-full bg-slate-800 border border-blue-500/50 text-white rounded-b-lg p-3 text-center text-xl font-mono font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all shadow-inner">
                    </div>

                    <div class="flex flex-col">
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-widest text-center bg-slate-800 py-2.5 rounded-t-lg border border-b-0 border-slate-700">Biển Ra</div>
                        <div class="h-28 bg-black border-x border-slate-700 flex items-center justify-center p-1.5 relative">
                            <img id="imgCamOut" src="https://placehold.co/200x80/1a1a1a/475569?text=Waiting" class="absolute inset-0 w-full h-full object-contain" alt="Biển Ra">
                        </div>
                        <input type="text" id="plateOut" value="" placeholder="---" class="w-full bg-slate-800 border border-blue-500/50 text-white rounded-b-lg p-3 text-center text-xl font-mono font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all shadow-inner">
                    </div>
                </div>

                <div class="mt-auto bg-slate-800/30 rounded-xl p-5 border border-slate-700/50">
                    <div class="flex flex-col gap-3.5 text-sm">
                        <div class="flex justify-between border-b border-slate-700/50 pb-2.5">
                            <span class="text-slate-400">Mã thẻ RFID:</span>
                            <span id="ticketCodeDisplay" class="text-slate-200 font-mono font-bold bg-slate-800 px-2 py-0.5 rounded border border-slate-700">---</span>
                        </div>
                        <div class="flex justify-between border-b border-slate-700/50 pb-2.5">
                            <span class="text-slate-400">Giờ vào:</span>
                            <span id="timeInDisplay" class="text-slate-200 font-medium font-mono">--:--:--</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Giờ ra:</span>
                            <span id="timeOutDisplay" class="text-slate-200 font-medium font-mono">--:--:--</span>
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
